<div class="flex flex-col gap-6 md:flex-row">
  <aside class="md:w-96 md:shrink-0">
    <button
      type="button"
      class="mb-2 w-full rounded-md border border-slate-200 px-3 py-2 text-left text-sm font-medium md:hidden"
      (click)="tocOpen.set(!tocOpen())"
    >
      {{ tocOpen() ? 'Hide' : 'Show' }} contents
    </button>
    <nav [class.hidden]="!tocOpen()" class="md:sticky md:top-20 md:block">
      <h2 class="mb-2 text-xs font-semibold tracking-wide text-slate-500 uppercase">Contents</h2>
      @if (toc.error()) {
        <p class="text-sm text-red-600">Could not load the table of contents.</p>
      }
      <ol class="space-y-1">
        @for (entry of toc.value() ?? []; track entry.file) {
          <li>
            <a
              [routerLink]="['/', db(), slug(entry)]"
              routerLinkActive="bg-blue-50 font-semibold text-blue-700"
              class="block rounded-md px-3 py-1.5 text-sm text-slate-700 hover:bg-slate-100"
              (click)="tocOpen.set(false)"
            >
              {{ entry.title }}
            </a>
          </li>
        }
      </ol>
    </nav>
  </aside>
  <section class="min-w-0 flex-1">
    <router-outlet />
  </section>
</div>
