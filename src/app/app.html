<header class="sticky top-0 z-10 border-b border-slate-200 bg-white/95 backdrop-blur">
  <nav class="mx-auto flex max-w-6xl flex-wrap items-center gap-x-6 gap-y-2 px-4 py-3">
    <a routerLink="/" class="text-lg font-semibold text-slate-900">SQL Tutorial</a>
    <ul class="flex flex-wrap gap-2">
      @for (db of databases.value() ?? []; track db.id) {
        <li>
          <a
            [routerLink]="['/', db.id]"
            routerLinkActive="bg-blue-600 text-white hover:bg-blue-600"
            class="block rounded-md px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100"
          >
            {{ db.name }}
          </a>
        </li>
      }
    </ul>
  </nav>
</header>

<main class="mx-auto max-w-6xl px-4 py-6">
  <router-outlet />
</main>
