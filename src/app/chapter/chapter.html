@if (src(); as src) {
  @if (failed()) {
    <p class="rounded-md bg-red-50 p-4 text-red-700">This chapter could not be found.</p>
  } @else {
    <markdown
      class="prose max-w-none prose-pre:bg-slate-900"
      [src]="src"
      (load)="onLoad()"
      (error)="failed.set(true)"
    />
  }

  <div class="mt-10 flex justify-between gap-4 border-t border-slate-200 pt-4 text-sm">
    @if (prev(); as p) {
      <a [routerLink]="['/', db(), slug(p)]" class="text-blue-700 hover:underline">← {{ p.title }}</a>
    } @else {
      <span></span>
    }
    @if (next(); as n) {
      <a [routerLink]="['/', db(), slug(n)]" class="text-blue-700 hover:underline">{{ n.title }} →</a>
    }
  </div>
}
