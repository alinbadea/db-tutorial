<rect class="bg" width="840" height="352" rx="10"/>
<rect x="76" y="14" width="128" height="28" rx="14" class="pill"/><text x="140" y="33" class="pillt" text-anchor="middle">1. FROM</text>
<text x="210" y="33" class="arrowt" text-anchor="middle">›</text>
<rect x="216" y="14" width="128" height="28" rx="14" class="pill"/><text x="280" y="33" class="pillt" text-anchor="middle">2. GROUP BY</text>
<text x="350" y="33" class="arrowt" text-anchor="middle">›</text>
<rect x="356" y="14" width="128" height="28" rx="14" class="pill"/><text x="420" y="33" class="pillt" text-anchor="middle">3. Agregare</text>
<text x="490" y="33" class="arrowt" text-anchor="middle">›</text>
<rect x="496" y="14" width="128" height="28" rx="14" class="pill"/><text x="560" y="33" class="pillt" text-anchor="middle">4. HAVING</text>
<text x="630" y="33" class="arrowt" text-anchor="middle">›</text>
<rect x="636" y="14" width="128" height="28" rx="14" class="pill"/><text x="700" y="33" class="pillt" text-anchor="middle">5. SELECT</text>
<rect x="636" y="14" width="128" height="28" rx="14" class="pillon"/><text x="700" y="33" class="pillont" text-anchor="middle">5. SELECT</text>
<rect x="24" y="56" width="792" height="106" rx="8" class="qbox"/>
<rect x="35" y="64" width="594" height="22" rx="4" class="qhl"/>
<text class="sql" x="38" y="80" textLength="588.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan class="kw">SELECT</tspan>   IdCategorie, <tspan class="kw">COUNT</tspan>(*) <tspan class="kw">AS</tspan> NumarProduse, <tspan class="kw">SUM</tspan>(Stoc) <tspan class="kw">AS</tspan> StocTotal</text><text class="sql" x="38" y="102" textLength="134.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan class="kw">FROM</tspan>     Produse</text><text class="sql" x="38" y="124" textLength="168.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan class="kw">GROUP BY</tspan> IdCategorie</text><text class="sql" x="38" y="146" textLength="193.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan class="kw">HAVING</tspan>   <tspan class="kw">COUNT</tspan>(*) &gt;= 2;</text>
<text x="420" y="192" class="explain" text-anchor="middle"><tspan class="explainb">SELECT:</tspan> rezultatul final are câte un rând pentru fiecare grup rămas.</text>
<g transform="translate(-214 30)"><rect x="484" y="214" width="300" height="26" class="th"/><text x="492" y="231" class="tht key">IdCategorie</text><text x="588" y="231" class="tht agg">NumarProduse</text><text x="700" y="231" class="tht agg">StocTotal</text></g>
<rect x="269" y="243" width="302" height="80" rx="3" class="resframe"/><text x="270" y="234" class="restitle">Rezultat (2 rânduri)</text>
<g transform="translate(-214 8)"><rect x="484" y="262" width="300" height="26" fill="#dbeafe" class="row"/><rect x="484" y="262" width="4" height="26" fill="#2563eb"/><text x="492" y="279" class="td keyv" fill="#2563eb">1</text><text x="588" y="279" class="td aggv">4</text><text x="700" y="279" class="td aggv">260</text></g>
<g transform="translate(-214 -94)"><rect x="484" y="390" width="300" height="26" fill="#fef3c7" class="row"/><rect x="484" y="390" width="4" height="26" fill="#d97706"/><text x="492" y="407" class="td keyv" fill="#d97706">2</text><text x="588" y="407" class="td aggv">2</text><text x="700" y="407" class="td aggv">105</text></g>
