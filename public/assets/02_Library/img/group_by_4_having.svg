<rect x="24" y="56" width="792" height="106" rx="8" class="qbox"/>
<rect x="35" y="130" width="199.20000000000002" height="22" rx="4" class="qhl"/>
<text class="sql" x="38" y="80" textLength="604.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan class="kw">SELECT</tspan>   ClientID, <tspan class="kw">COUNT</tspan>(*) <tspan class="kw">AS</tspan> RentalCount, <tspan class="kw">SUM</tspan>(RentalDays) <tspan class="kw">AS</tspan> TotalDays</text><text class="sql" x="38" y="102" textLength="134.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan class="kw">FROM</tspan>     Rentals</text><text class="sql" x="38" y="124" textLength="142.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan class="kw">GROUP BY</tspan> ClientID</text><text class="sql" x="38" y="146" textLength="193.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan class="kw">HAVING</tspan>   <tspan class="kw">COUNT</tspan>(*) &gt;= 2;</text>
<text x="420" y="192" class="explain" text-anchor="middle"><tspan class="explainb">HAVING:</tspan> se păstrează doar clienții cu COUNT(*) &gt;= 2; ceilalți sunt eliminați.</text>
<rect x="44" y="214" width="326" height="26" class="th"/><text x="52" y="231" class="tht">RentalID</text><text x="132" y="231" class="tht key">ClientID</text><text x="212" y="231" class="tht">BookID</text><text x="282" y="231" class="tht">RentalDays</text>
