<text class="sql" x="38" y="80" textLength="646.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan class="kw">SELECT</tspan>   TeacherID, <tspan class="kw">COUNT</tspan>(*) <tspan class="kw">AS</tspan> SessionCount, <tspan class="kw">MAX</tspan>(AttendanceDate) <tspan class="kw">AS</tspan> LastDate</text><text class="sql" x="38" y="102" textLength="159.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan class="kw">FROM</tspan>     Attendance</text><text class="sql" x="38" y="124" textLength="151.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan class="kw">GROUP BY</tspan> TeacherID</text><text class="sql" x="38" y="146" textLength="184.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan class="kw">HAVING</tspan>   <tspan class="kw">COUNT</tspan>(*) &gt; 1;</text>
<text x="420" y="192" class="explain" text-anchor="middle"><tspan class="explainb">Agregare:</tspan> fiecare grup devine un singur rând; COUNT și MAX se calculează pe rândurile grupului.</text>
